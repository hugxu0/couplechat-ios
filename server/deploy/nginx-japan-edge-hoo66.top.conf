server {
    listen 80;
    listen [::]:80;
    server_name hoo66.top;
    root /var/www/hoo66;

    location /.well-known/acme-challenge/ {
        root /var/www/hoo66;
        default_type text/plain;
    }

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 127.0.0.1:8444 ssl default_server;
    server_name hoo66.top;

    ssl_certificate /etc/letsencrypt/live/hoo66.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoo66.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/couplechat-security-headers.conf;

    client_max_body_size 80m;

    # 外层 stream 以 proxy_protocol off 转发，所以这里看到的 TCP 来源是回环。
    # stream 必须只把 Cloudflare/local 的 hoo66.top 流量送到 8444，并拒绝
    # hoo66.top:other；在该边界下才可信任 Cloudflare 写入的真实客户端地址。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # 部署前把占位符替换为 RackNerd 的 Tailscale 地址；真实地址不进仓库。
    # 订阅等本机静态 location 保留在此 block 中，且必须放在 / 之前。
    # 签名参数等同短期 bearer token，不能写入默认包含完整 query 的 access log。
    location ^~ /media/ {
        access_log off;
        proxy_pass http://__RACKNERD_TAILSCALE_IP__:13000;
        proxy_http_version 1.1;
        proxy_set_header Host hoo66.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://__RACKNERD_TAILSCALE_IP__:13000;
        proxy_http_version 1.1;
        proxy_set_header Host hoo66.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
